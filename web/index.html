<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>小银杏 · 东北财经大学 AI 校园助手</title>
<link rel="icon" href="/mascot.jpg" type="image/jpeg" />
<style>
:root{
  --gold:#FFC53D; --gold-deep:#F5A623; --gold-light:#FFE9B3;
  --green:#3E9A5B; --green-soft:#E7F4EC;
  --cream:#FFF9E8; --bg:#FAF5E9; --card:#FFFFFF;
  --text:#2F2A1F; --muted:#8A7F5C; --line:#F0E7CF;
  --radius:18px; --shadow:0 8px 30px rgba(180,140,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.65;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;overflow:hidden}

/* 侧边栏 */
.sidebar{
  width:268px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand img{width:44px;height:44px;border-radius:14px;object-fit:cover;background:var(--gold-light)}
.brand .t{font-size:18px;font-weight:700;letter-spacing:.5px}
.brand .s{font-size:11px;color:var(--muted);margin-top:1px}
.new-chat{
  margin:2px 14px 12px;padding:11px;border-radius:14px;background:var(--gold);
  color:#3A2E00;font-weight:600;font-size:14px;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:.15s;
}
.new-chat:hover{background:var(--gold-deep);color:#fff}
.new-chat:active{transform:scale(.98)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 10px}
.side-label{font-size:11px;color:var(--muted);padding:8px 8px 6px;letter-spacing:1px}

/* 对话列表 + 对话管理 */
.conv-search{
  margin:2px 4px 8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;
  font-size:12px;outline:none;width:calc(100% - 8px);background:var(--bg);
}
.conv-search:focus{border-color:var(--gold)}
.conv-item{
  position:relative;padding:9px 8px;border-radius:11px;font-size:13px;color:#6b6145;cursor:pointer;
  display:flex;align-items:center;gap:7px;
}
.conv-item:hover{background:var(--cream)}
.conv-item.active{background:var(--gold-light);color:#4a3c0a;font-weight:600}
.conv-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.conv-item .pin{flex-shrink:0;font-size:11px}
.ctitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-btn{
  opacity:0;flex-shrink:0;border-radius:6px;padding:0 5px;line-height:1.4;
  color:var(--muted);font-size:15px;font-weight:700;
}
.conv-item:hover .more-btn{opacity:1}
.more-btn:hover{background:var(--gold-light);color:var(--gold-deep)}
.cmenu{
  position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 34px rgba(0,0,0,.14);padding:6px;min-width:172px;display:none;
}
.cmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text)}
.cmenu button:hover{background:var(--cream)}
.cmenu button.danger{color:#d9534f}
.cmenu .mi{width:18px;text-align:center}

/* 主区域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--card);
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.menu-btn{display:none;font-size:22px;color:var(--gold-deep);padding:2px 6px}
.topbar .mid{flex:1}
.topbar .title{font-size:16px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--muted)}
.chat-area{flex:1;overflow-y:auto;padding:22px 18px;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:0 auto}

/* 欢迎区 */
.welcome{text-align:center;padding:26px 10px 8px}
.welcome img{width:86px;height:86px;border-radius:26px;object-fit:cover;box-shadow:0 10px 26px rgba(200,150,30,.22)}
.welcome h1{font-size:22px;margin-top:14px;letter-spacing:1px}
.welcome h1 b{color:var(--gold-deep)}
.welcome p{color:var(--muted);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 15px;
  font-size:13px;color:#5d5436;transition:.15s;box-shadow:var(--shadow);
}
.chip:hover{border-color:var(--gold);color:var(--gold-deep);transform:translateY(-1px)}
.chip:active{transform:scale(.97)}

/* 消息 */
.msg{display:flex;gap:11px;margin:16px 0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .ava{width:36px;height:36px;border-radius:12px;flex-shrink:0;object-fit:cover}
.msg.user{flex-direction:row-reverse}
.msg.user .ava{background:var(--gold-light)}
.msg.user .bubble{background:var(--gold);color:#3a2e00;border-bottom-right-radius:6px}
.msg.assistant .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bubble{padding:11px 14px;border-radius:var(--radius);max-width:78%;word-wrap:break-word;position:relative}
.bubble .cat-tag{display:inline-block;font-size:10px;color:var(--muted);background:var(--cream);
  border-radius:8px;padding:2px 8px;margin-bottom:6px}
.msg.user .bubble .cat-tag{background:rgba(255,255,255,.35);color:#6b5200}

/* 可下载文件按钮 */
.file-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.file-btn{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green);
  border:1px solid #cde8d6;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none}
.file-btn:hover{background:#d6eedf}
.file-btn span{font-size:11px;opacity:.8}

/* 来源引用 */
.sources{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.sources summary{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.src-item{font-size:12px;color:#6b6145;padding:6px 0;border-bottom:1px solid #f6efdd}
.src-item:last-child{border:none}
.src-item a{color:var(--gold-deep);text-decoration:none;font-weight:600}
.src-item .meta{color:var(--muted);font-size:11px}

/* markdown */
.bubble .md h1,.bubble .md h2,.bubble .md h3{font-size:15px;font-weight:700;margin:8px 0 4px}
.bubble .md p{margin:4px 0}
.bubble .md ul,.bubble .md ol{margin:4px 0 4px 18px}
.bubble .md li{margin:2px 0}
.bubble .md code{background:#f3ecd8;border-radius:5px;padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bubble .md pre{background:#2f2a1f;color:#f6ecc8;border-radius:10px;padding:10px;overflow-x:auto;margin:6px 0}
.bubble .md pre code{background:none;color:inherit}
.bubble .md a{color:var(--gold-deep)}
.bubble .md strong{font-weight:700}

/* 图片预览 */
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.preview-img{max-width:180px;max-height:140px;border-radius:10px;object-fit:cover;border:1px solid rgba(0,0,0,.08)}

/* 朗读按钮 */
.bubble-actions{margin-top:8px;display:flex;justify-content:flex-end}
.speak-btn{font-size:14px;padding:4px 10px;border-radius:10px;background:var(--cream);color:var(--gold-deep)}
.speak-btn:hover{background:var(--gold-light)}

/* 输入区 */
.composer{flex-shrink:0;padding:12px 18px 16px;background:var(--card);border-top:1px solid var(--line)}
.composer-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 10px;transition:.15s}
.composer-inner:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.18)}
.tool-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;color:#6b6145;font-weight:400}
.tool-btn:hover{background:var(--cream)}
.tool-btn.recording{background:#ffe2e2;color:#d33;font-size:19px}
.composer textarea{flex:1;border:none;outline:none;resize:none;font-size:15px;line-height:22px;
  max-height:120px;padding:0 6px;background:transparent}
.send-btn{width:42px;height:42px;border-radius:14px;background:var(--gold);color:#3a2e00;
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;transition:.15s}
.send-btn:hover{background:var(--gold-deep);color:#fff}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.hint{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center}

/* 待发送附件预览 */
.pending{max-width:820px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:8px}
.pending .chip-file{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:1px solid var(--line);
  border-radius:12px;padding:4px 10px;font-size:12px;color:#6b6145}
.pending .chip-file img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.pending .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px}

/* 打字指示 */
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--gold-deep);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* 遮罩 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9}

/* 后端未连接提示条 */
.banner{background:#FFF4E0;color:#9a6b00;border-bottom:1px solid #F5A623;padding:10px 18px;font-size:13px;text-align:center;flex-shrink:0}
.banner code{background:#f3e6c8;border-radius:4px;padding:1px 6px}

/* 移动端 */
@media (max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .overlay.show{display:block}
  .menu-btn{display:block}
  .topbar{padding:10px 12px}
  .chat-area{padding:14px 12px}
  .bubble{max-width:88%}
  .welcome img{width:72px;height:72px;border-radius:22px}
  .composer{padding:10px 12px 14px}
  .more-btn{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/mascot.jpg" alt="小银杏" />
      <div><div class="t">小银杏</div><div class="s">东北财经大学 · AI 校园助手</div></div>
    </div>
    <button class="new-chat" onclick="newChat()">＋ 新对话</button>
    <div class="side-scroll">
      <div class="side-label">最近对话</div>
      <input class="conv-search" id="convSearch" placeholder="🔍 搜索对话内容…"
             oninput="renderConvs()" onkeydown="if(event.key==='Escape'){this.value='';renderConvs();}" />
      <div id="convList"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <img src="/mascot.jpg" style="width:34px;height:34px;border-radius:10px" alt="" />
      <div class="mid">
        <div class="title">小银杏</div>
        <div class="sub">校园政策 · 课程安排 · 业务流程 · 材料审批</div>
      </div>
    </div>

    <div class="banner" id="backendWarn" style="display:none">
      ⚠️ 未连接后端服务 —— 请双击 <code>启动小银杏.bat</code> 启动服务，然后访问 <code>http://127.0.0.1:8000</code>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <img src="/mascot.jpg" alt="小银杏" />
          <h1>你好，我是<b>小银杏</b></h1>
          <p>东北财经大学的 AI 校园助手，随时为你解答校园问题</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="pending" id="pendingBar" style="display:none"></div>
      <div class="composer-inner">
        <button class="tool-btn" onclick="pickFiles()" title="上传图片 / 文件">＋</button>
        <textarea id="input" rows="1" placeholder="输入问题，或发送图片 / 文件 / 语音…（Enter 发送）"></textarea>
        <button class="tool-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
        <button class="send-btn" id="sendBtn" onclick="send()" title="发送">➤</button>
      </div>
      <div class="hint">支持上传图片、文件、音频；回答可点 🔊 朗读。重要事项请以官网通知为准</div>
    </div>
  </div>
</div>

<!-- 对话管理菜单 -->
<div class="cmenu" id="cmenu">
  <button onclick="pinConv()"><span class="mi">📌</span><span id="pinLabel">置顶</span></button>
  <button class="danger" onclick="delConv()"><span class="mi">🗑</span><span>删除聊天记录</span></button>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
<input type="file" id="fileInput" multiple hidden />

<script>
const $=s=>document.querySelector(s);
let history=[];
let streaming=false;
let pendingAtts=[];   // {name, data(base64), mime, kind, dataURL}

/* ============ 对话存储与管理 ============ */
let convs=[];            // {id, title, pinned, messages:[{role,content}], ts}
let currentConvId=null;
let menuTargetId=null;

function loadConvs(){
  try{
    const raw=JSON.parse(localStorage.getItem('ginkgo_convs')||'[]');
    // 兼容旧格式（纯字符串数组）：丢弃
    convs=raw.filter(c=>c&&typeof c==='object'&&Array.isArray(c.messages));
  }catch(e){convs=[];}
}
function saveConvs(){localStorage.setItem('ginkgo_convs',JSON.stringify(convs));}

function renderConvs(){
  const inp=$('#convSearch');
  const kw=(inp&&inp.value)?inp.value.trim().toLowerCase():'';
  let list=[...convs];
  if(kw){
    list=list.filter(c=>(c.title+' '+c.messages.map(m=>m.content).join(' ')).toLowerCase().includes(kw));
  }
  list.sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||(b.ts-a.ts));
  $('#convList').innerHTML=list.length?list.map(c=>`
    <div class="conv-item ${c.id===currentConvId?'active':''}" onclick="openConv('${c.id}')" title="${escapeHtml(c.title)}">
      <span class="dot"></span>
      ${c.pinned?'<span class="pin">📌</span>':''}
      <span class="ctitle">${escapeHtml(c.title)}</span>
      <button class="more-btn" onclick="toggleMenu(event,'${c.id}')" title="对话管理">⋯</button>
    </div>`).join('')
    :`<div class="conv-item" style="color:#c4b98f">${kw?'未找到相关对话':'暂无历史对话'}</div>`;
}

function ensureConv(title){
  if(currentConvId){
    const c=convs.find(x=>x.id===currentConvId);
    if(c){c.ts=Date.now();return;}
  }
  currentConvId='c'+Date.now()+Math.random().toString(36).slice(2,6);
  convs.unshift({id:currentConvId,title:(title||'新对话').slice(0,24),pinned:false,messages:[],ts:Date.now()});
  saveConvs();renderConvs();
}
function appendMsg(role,content){
  const c=convs.find(x=>x.id===currentConvId);
  if(!c)return;
  c.messages.push({role,content});
  c.ts=Date.now();
  saveConvs();renderConvs();
}
function openConv(id){
  const c=convs.find(x=>x.id===id);
  if(!c)return;
  currentConvId=id;
  history=c.messages.map(m=>({role:m.role,content:m.content}));
  removeWelcome();
  $('#chatInner').innerHTML='';
  if(c.messages.length){
    c.messages.forEach(m=>addMsg(m.role,m.content));
  }else{
    $('#chatInner').innerHTML=welcomeHtml();
  }
  renderConvs();scrollBottom();
  if(window.innerWidth<=760)toggleSidebar(false);
}
function pinConv(){
  $('#cmenu').style.display='none';
  const c=convs.find(x=>x.id===menuTargetId);
  if(c){c.pinned=!c.pinned;saveConvs();renderConvs();}
}
function delConv(){
  $('#cmenu').style.display='none';
  const c=convs.find(x=>x.id===menuTargetId);
  if(!c)return;
  if(!confirm('确定删除「'+c.title+'」的聊天记录吗？'))return;
  convs=convs.filter(x=>x.id!==menuTargetId);
  saveConvs();renderConvs();
  if(currentConvId===menuTargetId)newChat();
}
function toggleMenu(e,id){
  e.stopPropagation();
  menuTargetId=id;
  const m=$('#cmenu');
  const rect=e.currentTarget.getBoundingClientRect();
  m.style.display='block';
  m.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-m.offsetWidth-10))+'px';
  m.style.top=Math.min(rect.bottom+6,window.innerHeight-m.offsetHeight-10)+'px';
  const c=convs.find(x=>x.id===id);
  $('#pinLabel').textContent=(c&&c.pinned)?'取消置顶':'置顶';
}
document.addEventListener('click',()=>{$('#cmenu').style.display='none';});

/* ============ 初始加载 ============ */
async function init(){
  try{
    await fetch('/api/meta').then(r=>r.json());
    hideBackendWarn();
  }catch(e){
    showBackendWarn();
  }
  loadConvs();renderConvs();
  loadSuggestions();
}
function showBackendWarn(){const b=$('#backendWarn');if(b)b.style.display='block';}
function hideBackendWarn(){const b=$('#backendWarn');if(b)b.style.display='none';}
function loadSuggestions(){
  fetch('/api/suggestions').then(r=>r.json()).then(d=>{
    $('#chips').innerHTML=(d.items||[]).map(q=>`<button class="chip" onclick="quick(\`${q}\`)">${q}</button>`).join('');
  }).catch(()=>{});
}

/* ============ 交互 ============ */
function toggleSidebar(force){
  const sb=$('#sidebar'),ov=$('#overlay');
  const open=force!==undefined?force:!sb.classList.contains('open');
  sb.classList.toggle('open',open);ov.classList.toggle('show',open);
}
function newChat(){
  currentConvId=null;history=[];pendingAtts=[];renderPending();
  $('#chatInner').innerHTML=welcomeHtml();loadSuggestions();renderConvs();
  $('#input').value='';$('#input').focus();
}
function welcomeHtml(){
  return `<div class="welcome" id="welcome">
    <img src="/mascot.jpg" alt="小银杏"/>
    <h1>你好，我是<b>小银杏</b></h1>
    <p>东北财经大学的 AI 校园助手，随时为你解答校园问题</p>
    <div class="chips" id="chips"></div></div>`;
}
function quick(q){$('#input').value=q;send();}

/* ============ 上传（图片/文件/视频 统一入口） ============ */
function parseDataURL(d){
  const m=d.match(/^data:([^;]+);base64,(.*)$/s);
  return m?{mime:m[1],data:m[2]}:{mime:'',data:d};
}
function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function pickFiles(){
  const inp=$('#fileInput');inp.value='';inp.click();
  inp.onchange=async()=>{
    for(const f of inp.files){
      try{
        const d=await readAsDataURL(f);
        const {mime,data}=parseDataURL(d);
        if(mime.startsWith('video/')){
          alert('暂不支持上传视频');
          continue;
        }
        const kind=mime.startsWith('image/')?'image':mime.startsWith('audio/')?'audio':'file';
        pendingAtts.push({name:f.name,data,mime,kind,dataURL:d});
      }catch(e){/* 忽略读取失败 */}
    }
    renderPending();
  };
}
function renderPending(){
  const bar=$('#pendingBar');
  let html='';
  pendingAtts.forEach((a,i)=>{
    const inner=a.kind==='image'
      ?`<img src="${a.dataURL}">`
      :(a.kind==='audio'?'🎵 ':'📄 ')+escapeHtml(a.name);
    html+=`<span class="chip-file">${inner}<button class="x" onclick="rmAtt(${i})">×</button></span>`;
  });
  bar.innerHTML=html;
  bar.style.display=html?'flex':'none';
}
function rmAtt(i){pendingAtts.splice(i,1);renderPending();}

/* ============ 语音输入 ============ */
let recog=null,recording=false;
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('当前浏览器不支持语音输入，请使用 Chrome / Edge');return;}
  if(recording){recog&&recog.stop();return;}
  recog=new SR();
  recog.lang='zh-CN';recog.interimResults=false;recog.maxAlternatives=1;
  recog.onresult=e=>{const t=e.results[0][0].transcript;$('#input').value+=t;autoResize();};
  recog.onend=()=>{recording=false;$('#voiceBtn').classList.remove('recording');};
  recog.onerror=()=>{recording=false;$('#voiceBtn').classList.remove('recording');};
  recog.start();
  recording=true;$('#voiceBtn').classList.add('recording');
}
function speak(bubble){
  const text=bubble.querySelector('.md').textContent.trim();
  if(!text)return;
  if(!('speechSynthesis' in window)){alert('浏览器不支持语音播报');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=1;
  speechSynthesis.speak(u);
}

/* ============ 发送 ============ */
async function send(category){
  const input=$('#input');
  const text=input.value.trim();
  if((!text && !pendingAtts.length)||streaming)return;
  input.value='';autoResize();

  const imgs=pendingAtts.filter(a=>a.kind==='image').map(a=>a.dataURL);
  const files=pendingAtts.filter(a=>a.kind!=='image').map(a=>({name:a.name,data:a.data,mime:a.mime}));
  pendingAtts=[];renderPending();

  const showText=text||(imgs.length?'（图片）':'（附件）');
  removeWelcome();
  addMsg('user',showText,false,imgs);
  history.push({role:'user',content:text||(imgs.length?'请查看我发送的图片':'请查看我发送的文件')});
  ensureConv(showText);
  appendMsg('user',showText);

  const bubble=addMsg('assistant','',true);
  streaming=true;$('#sendBtn').disabled=true;
  let sources=[],filesResp=[],answer='';
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:text||(imgs.length?'请查看这张图片':'请查看我发送的文件'),
        history:history.slice(0,-1),stream:true,category:category||'',
        images:imgs, files
      })
    });
    if(!resp.ok){
      let msg='HTTP '+resp.status;
      try{const d=await resp.json();if(d&&d.detail)msg=typeof d.detail==='string'?d.detail:JSON.stringify(d.detail);}catch(_){}
      throw new Error(msg);
    }
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>-1){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+2);
        if(!line.startsWith('data:'))continue;
        let d;try{d=JSON.parse(line.slice(5))}catch(e){continue}
        if(d.type==='meta'){
          sources=d.sources||[];filesResp=d.files||[];
          if(d.category)setCatTag(bubble,d.category);
        }else if(d.type==='delta'){
          answer+=d.content;
          renderBubble(bubble,answer,sources,filesResp);
        }else if(d.type==='error'){
          answer+='\n\n⚠️ '+d.content;
          renderBubble(bubble,answer,sources,filesResp);
        }
      }
    }
  }catch(e){
    if(e instanceof TypeError)showBackendWarn();
    answer='抱歉，请求出错了：'+(e.message||e);
    renderBubble(bubble,answer,sources,filesResp);
  }finally{
    streaming=false;$('#sendBtn').disabled=false;
    renderBubble(bubble,answer,sources,filesResp);
    if(answer){
      history.push({role:'assistant',content:answer});
      appendMsg('assistant',answer);
    }
    scrollBottom();
  }
}
function setCatTag(bubble,cat){
  const cn={'policy':'政策制度','notice':'通知公告','course':'课程选课','exam':'考试安排','process':'办事流程',
    'guide':'办事指南','calendar':'校历时间','scholarship':'奖助贷','graduation':'毕业学位','service':'校园服务','general':'其他'};
  bubble.dataset.cat=cn[cat]||cat;
}
function renderBubble(bubble,text,sources,files){
  bubble.querySelector('.md').innerHTML=renderMarkdown(text);
  let head='';
  if(bubble.dataset.cat)head+=`<span class="cat-tag">🔎 ${bubble.dataset.cat}</span>`;
  if(files&&files.length){
    head+=`<div class="file-btns">`+files.map(f=>
      `<a class="file-btn" href="${escapeHtml(f.url)}" target="_blank" rel="noopener">📄 ${escapeHtml(f.name)}<span>下载</span></a>`
    ).join('')+`</div>`;
  }
  if(sources&&sources.length){
    head+=`<details class="sources"><summary>参考来源（${sources.length}）</summary>`+
      sources.map((s,i)=>`<div class="src-item">[${i+1}] ${s.url?`<a href="${escapeHtml(s.url)}" target="_blank">${escapeHtml(s.title)}</a>`:escapeHtml(s.title)}
        <span class="meta"> · ${escapeHtml(s.date||'')} ${s.source?(' · '+escapeHtml(s.source)):''}</span></div>`).join('')+
      `</details>`;
  }
  bubble.querySelector('.head').innerHTML=head;
}
function addMsg(role,text,typing,images){
  const inner=$('#chatInner');
  const div=document.createElement('div');
  div.className='msg '+role;
  const ava=role==='user'
    ?'<img class="ava" src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 rx=%2212%22 fill=%22%23FFE9B3%22/><text x=%2220%22 y=%2226%22 font-size=%2218%22 text-anchor=%22middle%22>👤</text></svg>" alt="">'
    :'<img class="ava" src="/mascot.jpg" alt="">';
  let content=typing?'<span class="typing"><span></span><span></span><span></span></span>':renderMarkdown(text);
  if(images&&images.length){
    content+=`<div class="imgs">`+images.map(im=>`<img class="preview-img" src="${im}">`).join('')+`</div>`;
  }
  const actions=role==='assistant'?`<div class="bubble-actions"><button class="speak-btn" onclick="speak(this.closest('.bubble'))">🔊 朗读</button></div>`:'';
  div.innerHTML=ava+`<div class="bubble"><div class="head"></div><div class="md">${content}</div>${actions}</div>`;
  inner.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}
function removeWelcome(){const w=$('#welcome');if(w)w.remove();}
function scrollBottom(){const a=$('#chatArea');a.scrollTop=a.scrollHeight;}

/* ============ 输入框 ============ */
const ta=$('#input');
ta.addEventListener('input',autoResize);
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
function autoResize(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';}

/* ============ 迷你 markdown 渲染 ============ */
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(src){
  if(!src)return '';
  let s=escapeHtml(src);
  s=s.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c}</code></pre>`);
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/^######\s*(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^#####\s*(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^####\s*(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^###\s*(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^##\s*(.+)$/gm,'<h2>$1</h2>');
  s=s.replace(/^#\s*(.+)$/gm,'<h1>$1</h1>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/^\s*(\d+)\.\s+(.+)$/gm,'<li>$2</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  s=s.replace(/<\/li>\s*<li>/g,'</li><li>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s=s.split(/\n{2,}/).map(p=>{
    if(/^<(h\d|ul|ol|pre|li)/.test(p))return p;
    return `<p>${p.replace(/\n/g,'<br/>')}</p>`;
  }).join('');
  return s;
}

init();
</script>
